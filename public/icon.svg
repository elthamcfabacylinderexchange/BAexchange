<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded kiosk corner radius -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Gold Shield Rim -->
  <path d="M 256 64 C 360 64 416 110 416 230 C 416 350 290 424 256 448 C 222 424 96 350 96 230 C 96 110 152 64 256 64 Z" fill="none" stroke="url(#gold)" stroke-width="12" filter="url(#shadow)"/>
  <!-- Inner Dark Plate -->
  <path d="M 256 80 C 348 80 398 122 398 230 C 398 338 286 406 256 428 C 226 406 114 338 114 230 C 114 122 164 80 256 80 Z" fill="#0f172a" opacity="0.85"/>
  <!-- BA Cylinder Graphic in Center -->
  <g transform="translate(256, 240) scale(1.15)">
    <!-- Cylinder Body -->
    <rect x="-32" y="-70" width="64" height="150" rx="32" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4"/>
    <!-- Yellow 300 BAR Band -->
    <rect x="-32" y="-20" width="64" height="30" fill="#eab308"/>
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#0f172a" text-anchor="middle">300 BAR</text>
    <!-- Valve assembly -->
    <rect x="-10" y="-90" width="20" height="22" rx="4" fill="#64748b"/>
    <rect x="-18" y="-100" width="36" height="12" rx="6" fill="#94a3b8"/>
    <!-- Pressure Gauge -->
    <circle cx="20" cy="-80" r="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <circle cx="20" cy="-80" r="2" fill="#dc2626"/>
    <line x1="20" y1="-80" x2="26" y2="-84" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Text Label CFA -->
  <text x="256" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">CFA BA</text>
  <text x="256" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#fde047" text-anchor="middle" letter-spacing="2">ELTHAM BRIGADE</text>
</svg>
